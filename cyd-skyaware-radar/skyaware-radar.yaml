esphome:
  name: "skyaware-radar"
  friendly_name: SkyAware Radar Display
  min_version: 2025.5.0
  name_add_mac_suffix: false
  includes:
    - my_radar.h
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: backlight
          brightness: 65%

preferences:
  flash_write_interval: 15min

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret esphome_screen__encryption_key

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable http_request to fetch the JSON API from the Python Proxy Server
http_request:
  useragent: esphome/cyd-monitor
  timeout: 5s

interval:
  - interval: 5s
    then:
      - http_request.get:
          # IMPORTANT: Change this IP address to your Mac's local IP address
          # where you are running the 'skyaware_proxy.py' server!
          url: "http://192.168.50.XXX:5050/nearby"
          request_headers:
            Accept: application/json
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  parse_aircraft_json(body);

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_gray
    red: 40%
    green: 40%
    blue: 40%
  - id: my_darkgray
    red: 20%
    green: 20%
    blue: 20%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%

font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12

# Standard SPI configuration copied exactly from ha-monitor.yaml
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# Backlight Control (Standard CYD Backlight is on GPIO21)
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# Display configuration copied exactly from your working ha-monitor.yaml
display:
  - platform: ili9xxx
    model: ILI9341
    id: my_display
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    auto_clear_enabled: false
    invert_colors: false
    color_order: RGB
    rotation: 90
    dimensions:
      width: 240
      height: 320
    update_interval: 1s

    lambda: |-
      // Clear display background to black
      it.fill(my_black);

      int cx = 160;
      int cy = 120;
      float scale = 3.66; // Radar pixel scaling factor for 320x240 screen (110 pixels / 30 NM)
      float max_range = 30.0; // In NM

      // 1. Draw Radar Range Rings (Concentric circles)
      it.circle(cx, cy, (int)(max_range * 0.33f * scale), my_darkgray); // 10 NM Ring
      it.circle(cx, cy, (int)(max_range * 0.66f * scale), my_darkgray); // 20 NM Ring
      it.circle(cx, cy, (int)(max_range * scale), my_darkgray);        // 30 NM Ring

      // 2. Draw Radar Crosshairs
      it.line(cx, cy - 3, cx, cy - (int)(max_range * scale), my_darkgray);
      it.line(cx, cy + 3, cx, cy + (int)(max_range * scale), my_darkgray);
      it.line(cx - 3, cy, cx - (int)(max_range * scale), cy, my_darkgray);
      it.line(cx + 3, cy, cx + (int)(max_range * scale), cy, my_darkgray);

      // Draw Center Home Point (Receiver location)
      it.filled_circle(cx, cy, 3, my_red);

      // 3. Draw Cardinal Direction Labels
      it.print(cx, cy - (int)(max_range * scale) + 4, id(roboto_12), my_gray, TextAlign::CENTER, "N");
      it.print(cx, cy + (int)(max_range * scale) - 14, id(roboto_12), my_gray, TextAlign::CENTER, "S");
      it.print(cx - (int)(max_range * scale) + 6, cy - 6, id(roboto_12), my_gray, TextAlign::LEFT, "W");
      it.print(cx + (int)(max_range * scale) - 14, cy - 6, id(roboto_12), my_gray, TextAlign::LEFT, "E");

      // Print max range indicator
      it.printf(cx - 3, cy + 5, id(roboto_12), my_gray, TextAlign::RIGHT, "%.0f NM", max_range);

      // 4. Draw Aircraft Points and Flight Data
      if (!is_updating) {
        for (const auto& ac : global_aircraft) {
          int px = cx + (int)(ac.x_nm * scale);
          int py = cy - (int)(ac.y_nm * scale);

          // Verify screen boundary safety
          if (px >= 0 && px < 320 && py >= 0 && py < 240) {
            // Select color based on altitude
            esphome::Color ac_color = my_green;
            if (ac.alt > 20000) {
              ac_color = my_white; // High altitude
            } else if (ac.alt < 5000) {
              ac_color = my_yellow; // Low altitude
            }

            // Draw airplane rotated triangular silhouette
            draw_aircraft(it, px, py, ac.track, ac_color);

            // Draw callsign/flight label and altitude
            it.print(px + 8, py - 6, id(roboto_12), ac_color, TextAlign::LEFT, ac.flight.c_str());
            it.printf(px + 8, py + 6, id(roboto_12), my_gray, TextAlign::LEFT, "%dK", ac.alt / 1000);
          }
        }
      }
